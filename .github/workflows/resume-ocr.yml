name: Resume OCR

on:
  schedule:
    # Backup for Vercel Hobby, which only allows a daily cron.
    # GitHub often starts this late or skips a run. Disable this workflow
    # after upgrading to Vercel Pro so the two schedules do not both fire.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ocr:
    name: Claim deferred scans
    runs-on: ubuntu-latest
    steps:
      - name: Call the OCR route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/ops/resume-ocr"
