name: Fairness monitoring

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: Record adverse-impact snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Call the nightly route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/ops/fairness"
