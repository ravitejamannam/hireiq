name: Interview reminders

on:
  schedule:
    # Vercel Hobby only runs cron once a day, so a 15-minute reminder
    # route there would skip the 1-hour emails. This is the sender.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    name: Send due interview reminders
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/ops/interview-reminders"
